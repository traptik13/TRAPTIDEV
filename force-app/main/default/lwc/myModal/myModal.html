<template>
    <lightning-modal-header label="Edit Record"></lightning-modal-header>


    <lightning-modal-body>
        <p><strong>Record Id:</strong> {recordId}</p>


        <lightning-input
            label="Name"
            value={name}
            onchange={handleChange}>
        </lightning-input>
    </lightning-modal-body>


    <lightning-modal-footer>
        <lightning-button
            label="Cancel"
            onclick={handleClose}>
        </lightning-button>


        <lightning-button
            variant="brand"
            label="Save"
            onclick={handleSave}>
        </lightning-button>
    </lightning-modal-footer>
</template>
