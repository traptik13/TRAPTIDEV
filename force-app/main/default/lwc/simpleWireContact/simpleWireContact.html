<template>

    <lightning-card title="10 Contacts">

        <div class="slds-p-around_medium">

            <template if:true={contacts}>

                <template
                    for:each={contacts}
                    for:item="contact">

                    <div
                        key={contact.Id}
                        class="slds-m-bottom_small">

                        <p>
                            <strong>
                                {contact.FirstName}
                                {contact.LastName}
                            </strong>
                        </p>

                        <p>{contact.Email}</p>

                        <p>{contact.Phone}</p>

                    </div>

                </template>

            </template>


            <template if:true={error}>

                <p>Error loading Contacts.</p>

            </template>

        </div>

    </lightning-card>

</template>
