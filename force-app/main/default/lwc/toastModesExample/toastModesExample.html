<template>
    <lightning-card title="Salesforce Operations Hub" icon-name="standard:actions_and_buttons">
        <div class="slds-var-m-around_medium">
            <p class="slds-var-m-bottom_medium slds-text-heading_small">
                Execute actions below to test production-ready notification scenarios:
            </p>
            
            <div class="slds-grid slds-wrap slds-gutters_small">
                <!-- Dismissible Button -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-var-m-bottom_small">
                    <lightning-button 
                        label="Create Acme Account" 
                        variant="success" 
                        icon-name="utility:add"
                        onclick={handleDismissible}
                        class="slds-size_full">
                    </lightning-button>
                </div>
                
                <!-- Pester Button -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-var-m-bottom_small">
                    <lightning-button 
                        label="Sync Contacts" 
                        variant="brand" 
                        icon-name="utility:sync"
                        onclick={handlePester}
                        class="slds-size_full">
                    </lightning-button>
                </div>
                
                <!-- Sticky Button -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-var-m-bottom_small">
                    <lightning-button 
                        label="Force System Error" 
                        variant="destructive" 
                        icon-name="utility:warning"
                        onclick={handleSticky}
                        class="slds-size_full">
                    </lightning-button>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
