<template>
    <lightning-card title="User Management">

        <div class="slds-p-around_medium">

            <lightning-button
                variant="brand"
                label="New User"
                onclick={handleNewUser}>
            </lightning-button>

        </div>

        <div class="slds-p-around_medium">

            <lightning-datatable
                key-field="Id"
                data={users}
                columns={columns}
                onrowaction={handleRowAction}
                hide-checkbox-column="true">
            </lightning-datatable>

        </div>

    </lightning-card>


    <template if:true={showForm}>

        <section
            role="dialog"
            tabindex="-1"
            class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">

                <header class="slds-modal__header">

                    <h2 class="slds-text-heading_medium">
                        {formTitle}
                    </h2>

                </header>


                <div class="slds-modal__content slds-p-around_medium">

                    <template if:false={isEditMode}>

                        <lightning-record-edit-form
                            object-api-name="User"
                            onsuccess={handleSuccess}
                            onerror={handleError}>

                            <lightning-messages></lightning-messages>

                            <lightning-input-field
                                field-name="FirstName">
                            </lightning-input-field>

                            <lightning-input-field
                                field-name="LastName">
                            </lightning-input-field>

                            <lightning-input-field
                                field-name="Email">
                            </lightning-input-field>

                            <lightning-input-field
                                field-name="Username">
                            </lightning-input-field>

                            <lightning-input-field
                                field-name="Alias">
                            </lightning-input-field>

                            <lightning-input-field 
                            field-name="UserRoleId"> 
                            </lightning-input-field>

                            <lightning-input-field
                                field-name="ProfileId">
                            </lightning-input-field>

                            <lightning-input-field
                                field-name="TimeZoneSidKey">
                            </lightning-input-field>

                            <lightning-input-field
                                field-name="LocaleSidKey">
                            </lightning-input-field>

                            <lightning-input-field
                                field-name="EmailEncodingKey">
                            </lightning-input-field>

                            <lightning-input-field
                                field-name="LanguageLocaleKey">
                            </lightning-input-field>

                             <lightning-input-field
                                field-name="IsActive">
                            </lightning-input-field>

                            <div class="slds-m-top_medium slds-text-align_right">

                                <lightning-button
                                    label="Cancel"
                                    onclick={handleCancel}>
                                </lightning-button>

                                <lightning-button
                                    class="slds-m-left_small"
                                    variant="brand"
                                    type="submit"
                                    label="Create User">
                                </lightning-button>

                            </div>

                        </lightning-record-edit-form>

                    </template>


                    <template if:true={isEditMode}>

                        <lightning-record-edit-form
                            object-api-name="User"
                            record-id={recordId}
                            onsuccess={handleSuccess}
                            onerror={handleError}>

                            <lightning-messages></lightning-messages>

                            <lightning-input-field
                                field-name="FirstName">
                            </lightning-input-field>

                            <lightning-input-field
                                field-name="LastName">
                            </lightning-input-field>

                            <lightning-input-field
                                field-name="Email">
                            </lightning-input-field>

                            <lightning-input-field
                                field-name="Username">
                            </lightning-input-field>

                            <lightning-input-field
                                field-name="IsActive">
                            </lightning-input-field>

                            <div class="slds-m-top_medium slds-text-align_right">

                                <lightning-button
                                    label="Cancel"
                                    onclick={handleCancel}>
                                </lightning-button>

                                <lightning-button
                                    class="slds-m-left_small"
                                    variant="brand"
                                    type="submit"
                                    label="Update User">
                                </lightning-button>

                            </div>

                        </lightning-record-edit-form>

                    </template>

                </div>

            </div>

        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>

    </template>

</template>
