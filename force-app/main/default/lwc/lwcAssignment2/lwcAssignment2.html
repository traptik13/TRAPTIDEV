<template>
    <template if:true={isLoading}>
        <lightning-spinner alt-name="Loading" size="medium" variant="brand"></lightning-spinner>
    </template>

    <lightning-card>
        <div class="slds-text-align_center slds-text-heading_medium slds-p-around_small">
            Student Information
        </div>

        <div class="slds-var-m-around_medium"> 
            <!-- Native Standalone Lookups with Cross-Filtering -->
            <div class="slds-grid slds-gutters slds-var-m-bottom_medium">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-record-picker
                        label="School"
                        placeholder="--Please Select School--"
                        object-api-name="School__c"
                        onchange={handleSchoolChange}>
                    </lightning-record-picker>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-record-picker
                        label="Class"
                        placeholder="--Please Select Class--"
                        object-api-name="Class__c"
                        disabled={isClassDisabled}
                        filter={classFilter}
                        onchange={handleClassChange}>
                    </lightning-record-picker>
                </div>
            </div>

            <div class="slds-grid slds-grid_align-end slds-var-m-bottom_small">
                <lightning-button 
                    label="New" 
                    variant="brand" 
                    onclick={handleNewStudentClick}
                    class="slds-var-m-right_small">
                </lightning-button>
                <lightning-button 
                    label="Delete" 
                    variant="destructive" 
                    onclick={handleBulkDelete}
                    disabled={isDeleteDisabled}>
                </lightning-button>
            </div>

            <template if:true={hasRecords}>
                <div style="height: 350px;">
                    <lightning-datatable
                        key-field="Id"
                        data={students}
                        columns={columns}
                        onrowaction={handleRowAction}
                        onrowselection={handleRowSelection}>
                    </lightning-datatable>
                </div>
            </template>
        </div>
    </lightning-card>

    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeFormModal}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-modal__title slds-hyphenate">{modalHeaderTitle}</h2>
                </header>
                
                <div class="slds-modal__content slds-var-p-around_medium">
                    <lightning-record-edit-form 
                        object-api-name="Studentlwc__c"
                        record-id={currentStudentRecordId}
                        onsuccess={handleFormSuccess}
                        onerror={handleFormError}>
                        <lightning-messages></lightning-messages>
                        
                        <lightning-input-field field-name="Name"></lightning-input-field>
                        <lightning-input-field field-name="Class__c"></lightning-input-field>
                        <lightning-input-field field-name="Age__c"></lightning-input-field>
                        <lightning-input-field field-name="Email__c"></lightning-input-field>
                        
                        <div class="slds-var-m-top_medium slds-grid slds-grid_align-end">
                            <lightning-button label="Cancel" onclick={closeFormModal} class="slds-var-m-right_small"></lightning-button>
                            <lightning-button type="submit" label="Save Data" variant="brand"></lightning-button>
                        </div>
                    </lightning-record-edit-form>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
