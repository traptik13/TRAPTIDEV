<template>
    <lightning-card title="Recent Opportunities" icon-name="standard:opportunity">
        <div slot="actions">
            <lightning-button label="New Opportunity" onclick={handleOpenModal}></lightning-button>
        </div>


        <div class="slds-m-around_medium">
            <template if:true={opportunities}>
                <lightning-datatable key-field="Id" data={opportunities} columns={columns}
                    hide-checkbox-column="true">
                </lightning-datatable>
            </template>
        </div>


        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close" onclick={handleCloseModal}>
                            <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium">Create New Opportunity</h2>
                    </header>


                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-record-edit-form object-api-name="Opportunity" onsuccess={handleSuccess}>
                            <lightning-messages></lightning-messages>
                            <lightning-input-field field-name="Name"></lightning-input-field>
                            <lightning-input-field field-name="StageName"></lightning-input-field>
                            <lightning-input-field field-name="CloseDate"></lightning-input-field>
                            <lightning-input-field field-name="Amount"></lightning-input-field>


                            <div class="slds-m-top_medium">
                                <lightning-button variant="brand" type="submit"
                                    label="Save Opportunity"></lightning-button>
                                <lightning-button label="Cancel" onclick={handleCloseModal}
                                    class="slds-m-left_x-small"></lightning-button>
                            </div>
                        </lightning-record-edit-form>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
