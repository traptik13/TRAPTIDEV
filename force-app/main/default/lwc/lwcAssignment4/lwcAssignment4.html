<template>
    <lightning-card>
        <div class="slds-text-align_center slds-text-heading_medium slds-p-around_small">
            Student Information
        </div>

        <div class="slds-p-around_medium">
           <div class="slds-grid slds-gutters slds-grid_vertical-align-end slds-var-m-bottom_medium">
                <div class="slds-col">
                    <lightning-input 
                        type="number" 
                        placeholder="--Type Number of Student Records--" 
                        value={numberOfRecords} 
                        onchange={handleNumberChange}>
                    </lightning-input>
                </div>
                <div class="slds-col">
                    <lightning-button 
                        variant="brand" 
                        label="Search" 
                        onclick={handleSearch}>
                    </lightning-button>
                </div>
            </div>

            <template if:true={errorMessage}>
                <div class="slds-text-color_error slds-m-top_small">
                    {errorMessage}
                </div>
            </template>
        </div>

        <template if:true={students.length}>
            <lightning-datatable
                key-field="Id"
                data={students}
                columns={columns}
                hide-checkbox-column>
            </lightning-datatable>
        </template>

        
            <template if:true={showNoRecords}>
                <div class="slds-p-around_medium slds-text-align_center">
                    No active student records found.
                </div>
            </template>


    </lightning-card>
</template>
