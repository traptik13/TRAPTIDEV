<template>
    <lightning-card>
        <div class="slds-text-align_center slds-text-heading_medium slds-p-around_small">
            User Information
        </div>
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-grid_align-end slds-m-bottom_medium">
                <lightning-button
                    label="New"
                    variant="brand"
                    onclick={openNewModal}>
                </lightning-button>
            </div>
            <lightning-datatable
                key-field="Id"
                data={users}
                columns={columns}
                onrowaction={handleRowAction}
                hide-checkbox-column="true">
            </lightning-datatable>
        </div>
        <template if:true={isModalOpen}>
            <section
                role="dialog"
                tabindex="-1"
                class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">
                            {modalTitle}
                        </h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <template if:true={isNewMode}>
                            <lightning-input
                                label="Last Name"
                                value={lastName}
                                required
                                onchange={handleChange}
                                data-field="lastName">
                            </lightning-input>
                            <lightning-input
                                label="Email"
                                type="email"
                                value={email}
                                required
                                onchange={handleChange}
                                data-field="email">
                            </lightning-input>
                            <lightning-input
                                label="Username"
                                value={username}
                                required
                                onchange={handleChange}
                                data-field="username">
                            </lightning-input>
                            
                            <lightning-record-edit-form
                                object-api-name="User">
                                <lightning-input-field
                                    field-name="ProfileId"
                                    required
                                    onchange={handleProfileChange}>
                                </lightning-input-field>
                            </lightning-record-edit-form>
                            <div class="slds-m-top_medium">
                                <lightning-button
                                    variant="brand"
                                    label="Save"
                                    onclick={handleSave}>
                                </lightning-button>
                                <lightning-button
                                    label="Cancel"
                                    onclick={closeModal}
                                    class="slds-m-left_x-small">
                                </lightning-button>
                            </div>
                        </template>
                        <template if:true={isEditMode}>
                            <lightning-record-edit-form
                                record-id={currentRecordId}
                                object-api-name="User"
                                onsuccess={handleSuccess}
                                onerror={handleError}>
                                <lightning-messages>
                                </lightning-messages>

                                <lightning-input-field
                                    field-name="FirstName">
                                </lightning-input-field>

                                <lightning-input-field
                                    field-name="LastName">
                                </lightning-input-field>

                                <lightning-input-field
                                    field-name="Username">
                                </lightning-input-field>

                                <lightning-input-field
                                    field-name="IsActive">
                                </lightning-input-field>

                                <lightning-input-field
                                    field-name="Email">
                                </lightning-input-field>


                                <div class="slds-m-top_medium">
                                    <lightning-button
                                        variant="brand"
                                        type="submit"
                                        label="Update">
                                </lightning-button>
                                <lightning-button
                                    label="Cancel"
                                    onclick={closeModal}
                                    class="slds-m-left_x-small">
                                </lightning-button>
                                </div>
                            </lightning-record-edit-form>
                        </template>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open">
            </div>
        </template>
    </lightning-card>
</template>
