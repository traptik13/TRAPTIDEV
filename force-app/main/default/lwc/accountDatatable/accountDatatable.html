<template>
    <lightning-card title="Account Datatable">

        <div class="slds-p-around_medium">
            <lightning-button
                label="Add Account"
                variant="brand"
                onclick={openModal}>
            </lightning-button>

            <lightning-datatable
                key-field="Id"
                data={accounts}
                columns={columns}
                class="slds-m-top_medium">
            </lightning-datatable>
        </div>
    </lightning-card>

    <!-- MODAL -->
    <template if:true={isModalOpen}>
        <section role="dialog" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <!-- Modal Header -->
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Add Account</h2>
                </header>

                <!-- Modal Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input
                        label="Name"
                        value={name}
                        required
                        onchange={handleChange}
                        data-field="name">
                    </lightning-input>

                    <lightning-input
                        label="Industry"
                        value={industry}
                        required
                        onchange={handleChange}
                        data-field="industry">
                    </lightning-input>

                    <lightning-input
                        label="Phone"
                        value={phone}
                        required
                        onchange={handleChange}
                        data-field="phone">
                    </lightning-input>
                </div>

                <!-- Modal Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Close"
                        onclick={closeModal}>
                    </lightning-button>

                    <lightning-button
                        label="OK"
                        variant="brand"
                        onclick={handleSave}
                        class="slds-m-left_small">
                    </lightning-button>
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
